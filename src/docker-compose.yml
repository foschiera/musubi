services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-musubi_dev_password}"
      WIKIMEDIA_USER_AGENT: "${WIKIMEDIA_USER_AGENT:-MusubiHistory/0.1 (local educational prototype)}"
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:2026.07.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-musubi_dev_password}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  neo4j-init:
    image: neo4j:2026.07.1
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"
    environment:
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-musubi_dev_password}"
    volumes:
      - ./neo4j/init.cypher:/init.cypher:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cypher-shell --address neo4j://neo4j:7687 --username neo4j
        --password "$${NEO4J_PASSWORD}" --file /init.cypher

volumes:
  neo4j-data:
  neo4j-logs:
